<!doctype html>
<html><head><meta charset="utf-8"></head><body style="margin:0">
<script>
/* Invisible Streamlit component: saves a JSON string in the visitor's own browser (localStorage) and hands it back.
   Args: skey, write (string or null), write_id (changes whenever Python wants to save). */
function post(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), '*'); }
var lastWrite = null, lastOut = null;
window.addEventListener('message', function (e) {
  if (!e.data || e.data.type !== 'streamlit:render') return;
  var a = e.data.args || {};
  try {
    if (a.write !== null && a.write !== undefined && a.write_id !== lastWrite) {
      localStorage.setItem(a.skey, a.write);
      lastWrite = a.write_id;
    }
  } catch (err) { /* storage blocked: Python keeps the in-memory copy for this visit */ }
  var data = null;
  try { data = localStorage.getItem(a.skey); } catch (err) { /* ignore */ }
  var out = { data: data, id: a.write_id };
  var s = JSON.stringify(out);
  if (s !== lastOut) { lastOut = s; post('streamlit:setComponentValue', { value: out, dataType: 'json' }); }
  post('streamlit:setFrameHeight', { height: 0 });
});
post('streamlit:componentReady', { apiVersion: 1 });
</script>
</body></html>
